# Local development stack — WebFrost + MinIO for S3 backend testing.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Then run the server with:
#   WEBFROST_STORAGE_BACKEND=s3 \
#   S3_ENDPOINT=http://localhost:9000 \
#   S3_BUCKET=webfrost \
#   S3_ACCESS_KEY_ID=minioadmin \
#   S3_SECRET_ACCESS_KEY=minioadmin \
#   S3_REGION=us-east-1 \
#   bun run --cwd packages/server src/index.ts
#
# MinIO console: http://localhost:9001  (user: minioadmin / pass: minioadmin)

services:
  # MinIO no longer publishes images to Docker Hub; Chainguard maintains a public build.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO web console
    volumes:
      - minio_data:/data

  # One-shot container that creates the webfrost bucket on first boot. The MinIO
  # image has no shell or client, so this waits for it and signs the request with
  # curl's built-in SigV4 support. An existing bucket answers 409, which is fine.
  minio-init:
    image: curlimages/curl:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        until curl -sf http://minio:9000/minio/health/live; do sleep 1; done;
        curl -s -o /dev/null -w 'create bucket: HTTP %{http_code}\n' -X PUT --aws-sigv4 'aws:amz:us-east-1:s3' --user minioadmin:minioadmin http://minio:9000/webfrost;
        echo 'Bucket ready: webfrost';
      "

volumes:
  minio_data:
    driver: local
