# Local development stack — WebFrost + MinIO for S3 backend testing.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Then run the server with:
#   WEBFROST_STORAGE_BACKEND=s3 \
#   S3_ENDPOINT=http://localhost:9000 \
#   S3_BUCKET=webfrost \
#   S3_ACCESS_KEY=minioadmin \
#   S3_SECRET_KEY=minioadmin \
#   S3_REGION=us-east-1 \
#   bun run --cwd packages/server src/index.ts
#
# MinIO console: http://localhost:9001  (user: minioadmin / pass: minioadmin)

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  # One-shot container that creates the webfrost bucket on first boot
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/webfrost;
        echo 'Bucket ready: local/webfrost';
      "

volumes:
  minio_data:
    driver: local
