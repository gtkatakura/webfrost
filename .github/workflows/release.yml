name: Release

# - Version tags (v*.*.*) publish the Docker image to GHCR, build the `webfrost` binaries for macOS,
#   Linux and Windows, attach them (with checksums.txt) to a GitHub Release, and update the Homebrew
#   formula in gtkatakura/homebrew-tap when the HOMEBREW_TAP_TOKEN secret is set.
# - A green CI run on main opens or updates the "Version Packages" pull request, and publishes to npm
#   once that pull request is merged.
# - Manual dispatch publishes the image from the chosen ref.
# See apps/docs/content/docs/contributing/releasing.mdx.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        type: choice
        options:
          - docker-ghcr

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate for tags and manual runs: the commit must already have a green CI run ────
  # CI runs on every push to main, so a tag cut from main has one. This reads that result
  # instead of running the tests a second time.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run'
    permissions:
      actions: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          if [ "$ok" -lt 1 ]; then
            echo "::error::No successful CI run for ${GITHUB_SHA}. Tag a commit on main that passed CI."
            exit 1
          fi

  # ── Changesets: "Version Packages" PR, and npm publish after it is merged ─────────
  changesets:
    name: Changesets
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      # Trusted publishing needs npm 11.5.1 or newer, which ships with Node 24.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run build

      # With changesets pending this opens or updates the pull request. With none pending (the
      # Version Packages pull request was just merged) it runs `publish`. Private packages are
      # skipped, so nothing is published until a package sets "private": false.
      - name: Create Version Packages PR or publish
        uses: changesets/action@v2.1.2
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # ── Docker: build and push the multi-arch server image to GHCR ────────────────────
  docker:
    name: Docker → GHCR
    needs: ci-gate
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'docker-ghcr')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows the newest stable version tag (not release candidates).
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Visual verification: smoke-test the pushed Docker image ──────────────
  verify-docker:
    name: Visual Verify → Docker
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7.0.1

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start WebFrost container
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:sha-${GITHUB_SHA::7}"
          docker run -d --name webfrost-verify \
            -p 3000:3000 \
            -e AUTH_DISABLED=true \
            -e HOST=0.0.0.0 \
            -e SESSION_SECRET=$(openssl rand -hex 32) \
            "$IMAGE"
          echo "Container started from $IMAGE"
          # Wait up to 60 s for health endpoint
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Server is ready"; exit 0
            fi
            echo "Waiting for server ($i/12)..."; sleep 5
          done
          echo "::error::Server failed to become healthy after 60s" >&2
          docker logs webfrost-verify >&2
          exit 1

      - name: Run visual verification
        working-directory: packages/ui
        run: bunx playwright test --config playwright.verify.config.ts
        env:
          VERIFY_URL: http://localhost:3000

      - name: Upload deploy screenshot
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: deploy-screenshot-${{ github.sha }}
          path: packages/ui/test-results/deploy-screenshot.png
          retention-days: 90

      - name: Stop container
        if: always()
        run: docker stop webfrost-verify && docker rm webfrost-verify

  # ── Binaries: the single-file `webfrost` executable for every platform ────────────
  # Bun cross-compiles, so one Linux runner builds all five. The result is smoke-tested on
  # the three OS families below before anything is published.
  binaries:
    name: Binaries
    needs: ci-gate
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # The web UI is embedded in the binary, so it is built first (the SDK is its dependency).
      - name: Build the web UI
        run: |
          bun run --filter @webfrost/sdk build
          bun run --filter @webfrost/ui build

      - name: Compile the binaries
        run: bun packages/cli/scripts/build-binary.ts --target all --outdir dist-binary --version "${GITHUB_REF_NAME#v}"

      - name: Package archives and checksums
        run: bun packages/cli/scripts/package-release.ts --outdir dist-binary --release-dir release

      - name: Show sizes and checksums
        run: |
          ls -lh release
          cat release/checksums.txt

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  # ── Run the binaries on the platforms they were built for ─────────────────────────
  verify-binaries:
    name: Verify binary (${{ matrix.name }})
    needs: binaries
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, archive: webfrost-linux-x64.tar.gz }
          - { name: darwin-arm64, os: macos-15, archive: webfrost-darwin-arm64.tar.gz }
          - { name: windows-x64, os: windows-2025, archive: webfrost-windows-x64.zip }
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-files
          path: release

      - name: Unpack
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir bin
          case "$ARCHIVE" in
            *.zip) unzip -q "release/$ARCHIVE" -d bin ;;
            *) tar -xzf "release/$ARCHIVE" -C bin ;;
          esac
          ls -l bin

      - name: Run it
        env:
          WEBFROST_DIR: ${{ runner.temp }}/webfrost-data
          EXPECTED: ${{ github.ref_name }}
        run: |
          bin/webfrost --version | tee version.txt
          grep -F "${EXPECTED#v}" version.txt
          bin/webfrost --help > /dev/null
          bin/webfrost init
          bin/webfrost list
          # doctor exits 1 when no Chromium is installed, which is fine here; it must still run.
          status=0
          bin/webfrost doctor || status=$?
          test "$status" -le 1

  # ── GitHub Release: archives, checksums and notes ─────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [binaries, verify-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-files
          path: release

      # Notes come from the changelog section of this version. Without one, GitHub writes
      # them from the merged pull requests.
      - name: Release notes
        id: notes
        run: |
          if bun scripts/release-notes.ts "${GITHUB_REF_NAME#v}" > notes.md; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "source=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_SOURCE: ${{ steps.notes.outputs.source }}
        run: |
          flags=(--title "$GITHUB_REF_NAME" --verify-tag)
          # 1.2.3-rc.1 and friends are pre-releases and never become "latest".
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
          if [ "$NOTES_SOURCE" = changelog ]; then flags+=(--notes-file notes.md); else flags+=(--generate-notes); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* "${flags[@]}"
          fi

  # ── Homebrew: update the formula in the tap ───────────────────────────────────────
  # Needs the HOMEBREW_TAP_TOKEN secret (a fine-grained token with contents: write on
  # gtkatakura/homebrew-tap only). Without it this job passes without doing anything, and
  # pre-releases never touch the formula.
  homebrew:
    name: Homebrew tap
    needs: github-release
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Check for the tap token
        id: token
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Homebrew tap skipped::The HOMEBREW_TAP_TOKEN secret is not set, so the formula was not updated."
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.token.outputs.present == 'true'

      - uses: jdx/mise-action@v5.2.8
        if: steps.token.outputs.present == 'true'
        with:
          install_args: bun

      - uses: actions/download-artifact@v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: release-files
          path: release

      - uses: actions/checkout@v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          repository: gtkatakura/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write the formula
        if: steps.token.outputs.present == 'true'
        run: |
          mkdir -p tap/Formula
          bun scripts/homebrew-formula.ts --version "${GITHUB_REF_NAME#v}" --checksums release/checksums.txt > tap/Formula/webfrost.rb
          ruby -c tap/Formula/webfrost.rb
          cat tap/Formula/webfrost.rb

      - name: Commit and push
        if: steps.token.outputs.present == 'true'
        working-directory: tap
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula/webfrost.rb
            git commit -m "webfrost ${GITHUB_REF_NAME#v}"
            git push
          else
            echo "The formula is already up to date."
          fi
