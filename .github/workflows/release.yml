name: Release

# Triggered on version tags, merges to main, or manually.
# See apps/docs/content/docs/contributing/releasing.mdx for full deploy path documentation.
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        type: choice
        options:
          - docker-ghcr
          - npm
          - all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate: CI must pass before any publish ────────────────────────────────
  ci-check:
    name: CI gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: bun
      - name: Cache Bun dependencies
        uses: actions/cache@v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  # ── Changesets: create/update "Version Packages" PR on main ──────────────
  changeset-pr:
    name: Changesets PR
    needs: ci-check
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: bun
      - name: Cache Bun dependencies
        uses: actions/cache@v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Create or update Version Packages PR
        uses: changesets/action@v1.7.0
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker: build and push server image to GHCR ──────────────────────────
  docker:
    name: Docker → GHCR
    needs: ci-check
    runs-on: ubuntu-24.04
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event.inputs.target == 'docker-ghcr' ||
      github.event.inputs.target == 'all'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Read Bun version from mise.toml
        id: bun-version
        run: echo "version=$(sed -n 's/^bun = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUN_VERSION=${{ steps.bun-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Visual verification: smoke-test the pushed Docker image ──────────────
  verify-docker:
    name: Visual Verify → Docker
    needs: docker
    runs-on: ubuntu-24.04
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event.inputs.target == 'docker-ghcr' ||
      github.event.inputs.target == 'all'
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6.0.2

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start WebFrost container
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:sha-${GITHUB_SHA::7}"
          docker run -d --name webfrost-verify \
            -p 3000:3000 \
            -e WEBFROST_DIR=/data \
            -e AUTH_DISABLED=true \
            -e SESSION_SECRET=$(openssl rand -hex 32) \
            "$IMAGE"
          echo "Container started from $IMAGE"
          # Wait up to 60 s for health endpoint
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Server is ready"; exit 0
            fi
            echo "Waiting for server ($i/12)..."; sleep 5
          done
          echo "::error::Server failed to become healthy after 60s" >&2
          docker logs webfrost-verify >&2
          exit 1

      - name: Run visual verification
        working-directory: packages/ui
        run: bunx playwright test --config playwright.verify.config.ts
        env:
          VERIFY_URL: http://localhost:3000

      - name: Upload deploy screenshot
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: deploy-screenshot-${{ github.sha }}
          path: packages/ui/test-results/deploy-screenshot.png
          retention-days: 90

      - name: Stop container
        if: always()
        run: docker stop webfrost-verify && docker rm webfrost-verify

  # ── npm: publish public packages ─────────────────────────────────────────
  # NOTE: packages are currently private. Flip "private": false in package.json
  # and set NPM_TOKEN secret before enabling this job for real publishes.
  npm-publish:
    name: npm publish (skeleton — not active)
    needs: ci-check
    runs-on: ubuntu-24.04
    if: false # Remove this line when packages are ready for npm publish
    steps:
      - uses: actions/checkout@v6.0.2
      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish @webfrost/core
        run: cd packages/core && bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @webfrost/cli
        run: cd packages/cli && bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
