name: Release

# - A green CI run on main opens or updates the "Version Packages" pull request. Once that pull
#   request is merged (no changesets left), it publishes to npm, tags v<version> and releases it in
#   this same run: a tag pushed with GITHUB_TOKEN does not start another workflow run.
# - A manually pushed version tag (v*.*.*: hotfixes, pre-releases) releases that tag.
# - A release publishes the Docker image to GHCR, builds the `webfrost` binaries for macOS, Linux and
#   Windows, attaches them (with checksums.txt) to a GitHub Release, and updates the Homebrew formula
#   in gtkatakura/homebrew-tap when the HOMEBREW_TAP_TOKEN secret is set.
# - Manual dispatch publishes the image from the chosen ref.
# See apps/docs/content/docs/contributing/releasing.mdx.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        type: choice
        options:
          - docker-ghcr

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate for tags and manual runs: the commit must already have a green CI run ────
  # CI runs on every push to main, so a tag cut from main has one. This reads that result
  # instead of running the tests a second time.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run'
    permissions:
      actions: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          if [ "$ok" -lt 1 ]; then
            echo "::error::No successful CI run for ${GITHUB_SHA}. Tag a commit on main that passed CI."
            exit 1
          fi

  # ── Changesets: "Version Packages" PR, and npm publish after it is merged ─────────
  changesets:
    name: Changesets
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      # Trusted publishing needs npm 11.5.1 or newer, which ships with Node 24.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run build

      # With changesets pending this opens or updates the pull request. With none pending (the
      # Version Packages pull request was just merged) it runs `publish`. Private packages are
      # skipped, so nothing is published until a package sets "private": false.
      - name: Create Version Packages PR or publish
        uses: changesets/action@v2.1.2
        # changesets/action v2: the inputs are pr-title, commit-message and publish-script, and the token
        # comes from the github-token input (default: github.token), not the GITHUB_TOKEN env var.
        with:
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          publish-script: bunx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

  # ── Release tag: tag v<version> once the Version Packages pull request is merged ───
  # Runs after Changesets on every green CI run on main, and tags only when no changeset is
  # pending (the version bump has landed), the version is not 0.0.0 and the tag does not exist yet.
  # A later CI run on main finds the tag and does nothing. A re-run of this workflow run (attempt 2
  # and later) picks up the tag it pushed before, so the release jobs can be retried.
  release-tag:
    name: Release tag
    needs: changesets
    runs-on: ubuntu-24.04
    # One at a time, so two quick merges cannot both try to push the same tag.
    concurrency:
      group: release-tag
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Tag the version when it is ready
        id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "$pending changeset(s) pending: the Version Packages pull request is not merged yet. Nothing to release."
            exit 0
          fi
          if [ -f .changeset/pre.json ]; then
            echo "::notice title=No automatic release::Changesets is in pre-release mode. Push the pre-release tag by hand."
            exit 0
          fi

          version=$(jq -r .version packages/core/package.json)
          for pkg in cli server sdk ui; do
            other=$(jq -r .version "packages/$pkg/package.json")
            if [ "$other" != "$version" ]; then
              echo "::error::packages/$pkg is at $other but packages/core is at $version; the fixed group is out of sync."
              exit 1
            fi
          done
          if [ "$version" = 0.0.0 ]; then
            echo "Version is 0.0.0: nothing has been versioned yet. Nothing to release."
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$version is not a semantic version."
            exit 1
          fi
          tag="v$version"

          # The commit the tag points at, empty when there is no such tag (^{} peels an annotated tag).
          tagged_sha() {
            git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" |
              sort -k2 | tail -n 1 | cut -f1
          }
          existing=$(tagged_sha)
          if [ -z "$existing" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "WebFrost $tag" "$SHA"
            if git push origin "refs/tags/$tag"; then
              echo "Tagged $SHA as $tag."
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Lost a race with another push of the same tag: treat it as already there.
            existing=$(tagged_sha)
            if [ -z "$existing" ]; then
              echo "::error::Could not push $tag."
              exit 1
            fi
          fi
          if [ "$existing" = "$SHA" ] && [ "$ATTEMPT" -gt 1 ]; then
            echo "$tag already points at $SHA and this is a re-run: releasing it again."
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "$tag already exists (at $existing). Nothing to release."
          fi

  # ── Release version: the tag and commit the jobs below build ──────────────────────
  # A pushed tag, the tag from the Release tag job, or, for a manual dispatch, the chosen ref.
  release:
    name: Release version
    needs: [ci-gate, release-tag]
    runs-on: ubuntu-24.04
    if: |
      !cancelled() && (
        (github.event_name == 'push' && needs.ci-gate.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'docker-ghcr' && needs.ci-gate.result == 'success') ||
        (github.event_name == 'workflow_run' && needs.release-tag.result == 'success' && needs.release-tag.outputs.tag != '')
      )
    permissions: {}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      full: ${{ steps.resolve.outputs.full }}
    steps:
      - name: Resolve the tag and commit
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          AUTO_TAG: ${{ needs.release-tag.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$EVENT" in
            push) tag="$GITHUB_REF_NAME"; sha="$GITHUB_SHA"; full=true ;;
            workflow_run) tag="$AUTO_TAG"; sha="$HEAD_SHA"; full=true ;;
            *)
              # Manual dispatch: the Docker image only, with version tags when the ref is a tag.
              sha="$GITHUB_SHA"; full=false; tag=""
              case "$GITHUB_REF" in refs/tags/v*) tag="$GITHUB_REF_NAME" ;; esac
              ;;
          esac
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not a version tag (v1.2.3 or v1.2.3-rc.1)."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "sha=$sha"
            echo "short_sha=${sha::7}"
            echo "full=$full"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag:-(no version tag)} from $sha (full release: $full)."

  # ── Docker: build and push the multi-arch server image to GHCR ────────────────────
  docker:
    name: Docker → GHCR
    needs: release
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows the newest stable version tag (not release candidates). The version is
      # passed explicitly because on a workflow_run event the ref is main, not the tag. semver
      # skips <major>.<minor> for a pre-release, which then gets only <version>.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.tag != '' }}
            type=raw,value=sha-${{ needs.release.outputs.short_sha }}
            type=raw,value=latest,enable=${{ needs.release.outputs.tag != '' && !contains(needs.release.outputs.tag, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Visual verification: smoke-test the pushed Docker image ──────────────
  verify-docker:
    name: Visual Verify → Docker
    needs: [release, docker]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start WebFrost container
        env:
          SHORT_SHA: ${{ needs.release.outputs.short_sha }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}/server:sha-${SHORT_SHA}"
          docker run -d --name webfrost-verify \
            -p 3000:3000 \
            -e AUTH_DISABLED=true \
            -e HOST=0.0.0.0 \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            "$IMAGE"
          echo "Container started from $IMAGE"
          # Wait up to 60 s for health endpoint
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Server is ready"; exit 0
            fi
            echo "Waiting for server ($i/12)..."; sleep 5
          done
          echo "::error::Server failed to become healthy after 60s" >&2
          docker logs webfrost-verify >&2
          exit 1

      - name: Run visual verification
        working-directory: packages/ui
        run: bunx playwright test --config playwright.verify.config.ts
        env:
          VERIFY_URL: http://localhost:3000

      - name: Upload deploy screenshot
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: deploy-screenshot-${{ needs.release.outputs.sha }}
          path: packages/ui/test-results/deploy-screenshot.png
          retention-days: 90

      - name: Stop container
        if: always()
        run: docker stop webfrost-verify && docker rm webfrost-verify

  # ── Binaries: the single-file `webfrost` executable for every platform ────────────
  # Bun cross-compiles, so one Linux runner builds all five. The result is smoke-tested on
  # the three OS families below before anything is published.
  binaries:
    name: Binaries
    needs: release
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.full == 'true' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # The web UI is embedded in the binary, so it is built first (the SDK is its dependency).
      - name: Build the web UI
        run: |
          bun run --filter @webfrost/sdk build
          bun run --filter @webfrost/ui build

      - name: Compile the binaries
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: bun packages/cli/scripts/build-binary.ts --target all --outdir dist-binary --version "$VERSION"

      - name: Package archives and checksums
        run: bun packages/cli/scripts/package-release.ts --outdir dist-binary --release-dir release

      - name: Show sizes and checksums
        run: |
          ls -lh release
          cat release/checksums.txt

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  # ── Run the binaries on the platforms they were built for ─────────────────────────
  verify-binaries:
    name: Verify binary (${{ matrix.name }})
    needs: [release, binaries]
    runs-on: ${{ matrix.os }}
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, archive: webfrost-linux-x64.tar.gz }
          - { name: darwin-arm64, os: macos-15, archive: webfrost-darwin-arm64.tar.gz }
          - { name: windows-x64, os: windows-2025, archive: webfrost-windows-x64.zip }
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-files
          path: release

      - name: Unpack
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir bin
          case "$ARCHIVE" in
            *.zip) unzip -q "release/$ARCHIVE" -d bin ;;
            *) tar -xzf "release/$ARCHIVE" -C bin ;;
          esac
          ls -l bin

      - name: Run it
        env:
          WEBFROST_DIR: ${{ runner.temp }}/webfrost-data
          EXPECTED: ${{ needs.release.outputs.tag }}
        run: |
          bin/webfrost --version | tee version.txt
          grep -F "${EXPECTED#v}" version.txt
          bin/webfrost --help > /dev/null
          bin/webfrost init
          bin/webfrost list
          # doctor exits 1 when no Chromium is installed, which is fine here; it must still run.
          status=0
          bin/webfrost doctor || status=$?
          test "$status" -le 1

  # ── GitHub Release: archives, checksums and notes ─────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [release, binaries, verify-binaries]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.verify-binaries.result == 'success' }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-files
          path: release

      # Notes come from the changelog section of this version. Without one, GitHub writes
      # them from the merged pull requests.
      - name: Release notes
        id: notes
        run: |
          if bun scripts/release-notes.ts "${TAG#v}" > notes.md; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "source=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_SOURCE: ${{ steps.notes.outputs.source }}
        run: |
          flags=(--title "$TAG" --verify-tag)
          # 1.2.3-rc.1 and friends are pre-releases and never become "latest".
          case "$TAG" in *-*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
          if [ "$NOTES_SOURCE" = changelog ]; then flags+=(--notes-file notes.md); else flags+=(--generate-notes); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* "${flags[@]}"
          fi

  # ── Homebrew: update the formula in the tap ───────────────────────────────────────
  # Needs the HOMEBREW_TAP_TOKEN secret (a fine-grained token with contents: write on
  # gtkatakura/homebrew-tap only). Without it this job passes without doing anything, and
  # pre-releases never touch the formula.
  homebrew:
    name: Homebrew tap
    needs: [release, github-release]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.github-release.result == 'success' && !contains(needs.release.outputs.tag, '-') }}
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Check for the tap token
        id: token
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Homebrew tap skipped::The HOMEBREW_TAP_TOKEN secret is not set, so the formula was not updated."
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: jdx/mise-action@v5.2.8
        if: steps.token.outputs.present == 'true'
        with:
          install_args: bun

      - uses: actions/download-artifact@v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: release-files
          path: release

      - uses: actions/checkout@v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          repository: gtkatakura/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write the formula
        if: steps.token.outputs.present == 'true'
        run: |
          mkdir -p tap/Formula
          bun scripts/homebrew-formula.ts --version "$VERSION" --checksums release/checksums.txt > tap/Formula/webfrost.rb
          ruby -c tap/Formula/webfrost.rb
          cat tap/Formula/webfrost.rb

      - name: Commit and push
        if: steps.token.outputs.present == 'true'
        working-directory: tap
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula/webfrost.rb
            git commit -m "webfrost $VERSION"
            git push
          else
            echo "The formula is already up to date."
          fi
