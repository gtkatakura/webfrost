name: Benchmarks

# Slow and not a merge gate: run by hand, and weekly to catch drift (Mondays 05:00 UTC).
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Internal microbenchmarks (extractors, cache, navigation, page load).
  micro:
    name: Microbenchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - run: bun run bench

      - name: Upload bench results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bench-results-${{ github.sha }}
          path: bench/
          if-no-files-found: ignore
          retention-days: 90

  bench:
    name: WebFrost vs ArchiveBox + wget + monolith
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Tools (Bun) at the versions pinned in mise.toml.
      - name: Setup Bun
        uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start benchmark services
        run: docker compose -f bench/vs-archivebox/docker-compose.yml up -d --wait
        timeout-minutes: 10

      - name: Pull competitor images
        run: |
          docker pull alpine:3.20
          if docker pull y2z/monolith 2>&1; then
            echo "MONOLITH_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "Monolith image unavailable — monolith scenarios will be skipped"
            echo "MONOLITH_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Run benchmark
        run: |
          SKIP_FLAGS=""
          [ "$MONOLITH_AVAILABLE" = "false" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-monolith"
          # --fixture-internal-url uses the Docker service name so tools running inside
          # bench_net containers can reach the fixture server (localhost:18080 is host-only).
          bun bench/vs-archivebox/run.ts \
            --fixture-internal-url http://fixtures \
            $SKIP_FLAGS
        timeout-minutes: 35

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f bench/vs-archivebox/docker-compose.yml logs --no-color

      - name: Generate chart report
        if: always()
        run: bun bench/vs-archivebox/chart.ts

      - name: Upload results and report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vs-competitors-results-${{ github.sha }}
          path: bench/vs-archivebox/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Stop services
        if: always()
        run: docker compose -f bench/vs-archivebox/docker-compose.yml down -v
