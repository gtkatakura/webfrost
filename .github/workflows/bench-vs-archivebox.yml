name: Benchmark vs competitors (ArchiveBox, wget, monolith)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: WebFrost vs ArchiveBox + wget + monolith
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Cache Bun dependencies
        uses: actions/cache@v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start benchmark services
        run: docker compose -f bench/vs-archivebox/docker-compose.yml up -d --wait
        timeout-minutes: 10

      - name: Pull competitor images
        run: |
          docker pull alpine:3.20
          if docker pull y2z/monolith 2>&1; then
            echo "MONOLITH_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "Monolith image unavailable — monolith scenarios will be skipped"
            echo "MONOLITH_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Run benchmark
        run: |
          SKIP_FLAGS=""
          [ "$MONOLITH_AVAILABLE" = "false" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-monolith"
          # --fixture-internal-url uses the Docker service name so tools running inside
          # bench_net containers can reach the fixture server (localhost:18080 is host-only).
          bun bench/vs-archivebox/run.ts \
            --fixture-internal-url http://fixtures \
            $SKIP_FLAGS
        timeout-minutes: 35

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f bench/vs-archivebox/docker-compose.yml logs --no-color

      - name: Generate chart report
        if: always()
        run: bun bench/vs-archivebox/chart.ts

      - name: Upload results and report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: vs-competitors-results-${{ github.sha }}
          path: bench/vs-archivebox/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Stop services
        if: always()
        run: docker compose -f bench/vs-archivebox/docker-compose.yml down -v
