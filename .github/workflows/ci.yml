name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # `bun run build` is the first step of the README quickstart; keep it working.
      - name: Build
        run: bun run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser SSRF guard and pipeline tests drive a real Chromium; without it
      # those tests are skipped rather than failed.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # MinIO no longer publishes images to Docker Hub (minio/minio and minio/mc
      # are gone); Chainguard maintains a public build. It has no shell or client,
      # so the bucket is created with curl's built-in SigV4 signing.
      - name: Start MinIO for integration tests
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          # Wait up to 30 s for MinIO to become ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"; break
            fi
            echo "Waiting for MinIO ($i/15)..."; sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live
          # Create integration test bucket
          curl -sf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user minioadmin:minioadmin \
            http://localhost:9000/webfrost-integration

      - name: Test
        run: bun run test
        env:
          MINIO_TEST_ENDPOINT: http://localhost:9000
          MINIO_TEST_BUCKET: webfrost-integration
          MINIO_TEST_ACCESS_KEY: minioadmin
          MINIO_TEST_SECRET_KEY: minioadmin

  # The core and server suites again, with every archive directory mapped to its
  # own schema (PostgreSQL) or database (MySQL) through WEBFROST_TEST_DATABASE_URL.
  # The servers run with `docker run` rather than as job services: services cannot
  # take server flags, and MySQL needs one for full-text search of short words.
  unit-tests-db:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL
            # postgres:17, pinned by digest.
            image: mirror.gcr.io/library/postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
            run: >-
              -e POSTGRES_USER=webfrost -e POSTGRES_PASSWORD=webfrost -e POSTGRES_DB=webfrost
              -p 5432:5432
            args: -c max_connections=300
            ready: pg_isready -h 127.0.0.1 -U webfrost -d webfrost
            url: postgres://webfrost:webfrost@127.0.0.1:5432/webfrost
          - name: MySQL
            # mysql:8.4 (LTS), pinned by digest.
            image: mirror.gcr.io/library/mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
            run: >-
              -e MYSQL_ROOT_PASSWORD=webfrost -e MYSQL_DATABASE=webfrost
              -p 3306:3306
            args: --innodb-ft-min-token-size=1 --max-connections=300
            ready: mysql -h 127.0.0.1 -uroot -pwebfrost -e "SELECT 1"
            # root: every test archive gets its own database (CREATE DATABASE).
            url: mysql://root:webfrost@127.0.0.1:3306/webfrost
    steps:
      - uses: actions/checkout@v7.0.1

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser SSRF guard and pipeline tests drive a real Chromium.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Start ${{ matrix.name }}
        run: |
          # Google's mirror of Docker Hub's official images (same digests): anonymous pulls from
          # Docker Hub are rate-limited on shared runners. Retried, since a pull can still flake.
          for i in 1 2 3 4 5; do docker pull -q "${{ matrix.image }}" && break; echo "pull failed ($i/5)"; sleep $((i * 5)); done
          docker run -d --name db ${{ matrix.run }} ${{ matrix.image }} ${{ matrix.args }}
          for i in $(seq 1 60); do
            if docker exec db ${{ matrix.ready }} >/dev/null 2>&1; then echo "${{ matrix.name }} is ready"; break; fi
            echo "Waiting for ${{ matrix.name }} ($i/60)..."; sleep 2
          done
          docker exec db ${{ matrix.ready }}

      - name: Core tests
        run: bun test
        working-directory: packages/core
        env:
          WEBFROST_TEST_DATABASE_URL: ${{ matrix.url }}

      - name: Server tests
        run: bun run test
        working-directory: packages/server
        env:
          WEBFROST_TEST_DATABASE_URL: ${{ matrix.url }}

      - name: Server API E2E tests
        run: bun run test:e2e
        working-directory: packages/server
        env:
          WEBFROST_TEST_DATABASE_URL: ${{ matrix.url }}

  server-api-e2e:
    name: Server API E2E Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Server API E2E tests
        run: bun run test:e2e
        working-directory: packages/server

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # Tools (Bun) at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # Pinned release, verified against its SHA-256 (same version as packages/server/Dockerfile).
      - name: Install yt-dlp
        env:
          YTDLP_VERSION: "2026.10.26"
          YTDLP_SHA256: 767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795
        run: |
          sudo curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_linux" -o /usr/local/bin/yt-dlp
          echo "${YTDLP_SHA256}  /usr/local/bin/yt-dlp" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Run E2E tests
        run: bunx playwright test
        working-directory: packages/ui
        env:
          CI: "true"

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-traces-${{ github.sha }}
          path: packages/ui/test-results/
          retention-days: 7

  docker-build:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      # Build only, no push: a broken Dockerfile (for example a missing workspace manifest)
      # must fail the pull request, not the release.
      - name: Build server image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build docs image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/docs/Dockerfile
          push: false
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max
