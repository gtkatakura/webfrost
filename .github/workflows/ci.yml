name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Cache Bun dependencies
        uses: actions/cache@v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Save node_modules cache
        uses: actions/cache/save@v5.0.4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ github.sha }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore node_modules cache
        id: cache-restore
        uses: actions/cache/restore@v5.0.4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ github.sha }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore node_modules cache
        id: cache-restore
        uses: actions/cache/restore@v5.0.4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ github.sha }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  unit-tests:
    name: Unit Tests
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore node_modules cache
        id: cache-restore
        uses: actions/cache/restore@v5.0.4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ github.sha }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Start MinIO for integration tests
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          # Wait up to 30 s for MinIO to become ready
          for i in $(seq 1 6); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"; break
            fi
            echo "Waiting for MinIO ($i/6)..."; sleep 5
          done
          # Create integration test bucket
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9000 \
            minio/mc:latest mb --ignore-existing local/webfrost-integration

      - name: Test
        run: bun run test
        env:
          MINIO_TEST_ENDPOINT: http://localhost:9000
          MINIO_TEST_BUCKET: webfrost-integration
          MINIO_TEST_ACCESS_KEY: minioadmin
          MINIO_TEST_SECRET_KEY: minioadmin

  server-api-e2e:
    name: Server API E2E Tests
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore node_modules cache
        id: cache-restore
        uses: actions/cache/restore@v5.0.4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ github.sha }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Server API E2E tests
        run: bun run test:e2e
        working-directory: packages/server

  e2e:
    name: E2E Tests
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore node_modules cache
        id: cache-restore
        uses: actions/cache/restore@v5.0.4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ github.sha }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install yt-dlp
        run: |
          sudo curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Run E2E tests
        run: bunx playwright test
        working-directory: packages/ui
        env:
          CI: "true"
          AUTH_DISABLED: "true"

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: playwright-traces-${{ github.sha }}
          path: packages/ui/test-results/
          retention-days: 7

  bench:
    name: Benchmarks
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore node_modules cache
        id: cache-restore
        uses: actions/cache/restore@v5.0.4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ github.sha }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Bench
        run: bun run bench

      - name: Upload bench results
        uses: actions/upload-artifact@v7.0.0
        with:
          name: bench-results-${{ github.sha }}
          path: bench/
          if-no-files-found: ignore
          retention-days: 90
