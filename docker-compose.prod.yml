services:
  webfrost:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/webfrost}/server:${IMAGE_TAG:-latest}
    # Or build locally: uncomment the build block and comment out image above
    # build:
    #   context: .
    #   dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      WEBFROST_DIR: /data
    volumes:
      - webfrost_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webfrost_data:
    driver: local
